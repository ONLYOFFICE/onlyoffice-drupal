field.formatter.settings.onlyoffice_form_formatter:
  type: mapping
  label: 'ONLYOFFICE form formatter settings'
  mapping:
    save_submissions:
      type: string
      label: 'Save all form submissions'
    hide_after_submission:
      type: string
      label: 'Hide all forms after submitting'
    width_unit:
      type: string
      label: 'Width units'
    width:
      type: integer
      label: 'Width'
    height_unit:
      type: string
      label: 'Height units'
    height:
      type: integer
      label: 'Height'

field.widget.settings.onlyoffice_form_widget:
  type: mapping
  label: 'ONLYOFFICE form widget settings'

field.storage_settings.onlyoffice_form:
  type: mapping
  label: 'ONLYOFFICE form field storage settings'

field.field_settings.onlyoffice_form:
  type: mapping
  label: 'ONLYOFFICE form field settings'
  mapping:
    description_field:
      type: boolean
      label: 'Enable description field'

field.value.onlyoffice_form:
  type: mapping
  label: 'Default value'
  mapping:
    target_id:
      type: integer
      label: 'Media ID'
    description:
      type: string
      label: 'Description'

media.source.onlyoffice_pdf_form:
  type: media.source.field_aware
  label: '"ONLYOFFICE PDF Form" media source configuration'
