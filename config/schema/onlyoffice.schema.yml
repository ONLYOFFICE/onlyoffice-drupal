# Schema for the configuration files of the ONLYOFFICE Connector module.
onlyoffice.settings:
  type: config_object
  label: 'ONLYOFFICE Connector settings'
  mapping:
    doc_server_url:
      type: string
      label: 'ONLYOFFICE Docs address'
    verify_peer_off:
      type: boolean
      label: 'Disable certificate verification (insecure)'
    doc_server_jwt:
      type: string
      label: 'ONLYOFFICE Docs secret key'
    doc_server_jwt_header:
      type: string
      label: 'Authorization header (leave blank to use default header)'
    doc_server_internal_url:
      type: string
      label: 'ONLYOFFICE Docs address for internal requests from the server'
    storage_url:
      type: string
      label: 'Server address for internal requests from ONLYOFFICE Docs'
    chat:
      type: boolean
      label: 'Display Chat menu button'
    compact_header:
      type: boolean
      label: 'Display the header more compact'
    feedback:
      type: boolean
      label: 'Display Feedback & Support menu button'
    help:
      type: boolean
      label: 'Display Help menu button'
    theme:
      type: string
      label: 'Default editor theme'
    plugins:
      type: boolean
      label: 'Enable plugins'
    macros:
      type: boolean
      label: 'Run document macros'
    protection:
      type: string
      label: 'Enable document protection for'
