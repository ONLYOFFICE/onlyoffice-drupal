name: Artifact

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Get Info
        id: info
        run: |
          version=$(grep -m 1 '^## ' CHANGELOG.md | grep -oE '^## [0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)[1-9][0-9]*)?$' | cut -c 4-)
          echo "version=${version:-$(git rev-parse --short HEAD)}" >> "$GITHUB_OUTPUT"
      - name: Build Artifact
        run: |
          mkdir -p ./deploy
          git archive --prefix=onlyoffice-drupal/ HEAD | tar -x -C ./deploy
          git -C assets/document-templates archive --prefix=onlyoffice-drupal/assets/document-templates/ HEAD -- . ':!AUTHORS.md' ':!LICENSE' ':!README.md' | tar -x -C ./deploy
      - name: Upload Artifact
        if: github.server_url == 'https://github.com'
        uses: actions/upload-artifact@v7
        with:
          name: onlyoffice-drupal-${{ steps.info.outputs.version }}
          path: deploy
      # actions/upload-artifact@v4+ takes Gitea for GHES and refuses to run; this
      # fork is the same action without that check.
      - name: Upload Artifact (Gitea)
        if: github.server_url != 'https://github.com'
        uses: christopherHX/gitea-upload-artifact@v4
        with:
          name: onlyoffice-drupal-${{ steps.info.outputs.version }}
          path: deploy
