name: Create Tag

on:
  push:
    branches: [main]
    paths:
      - 'CHANGELOG.md'

permissions:
  contents: write

jobs:
  create-tag:
    if: github.server_url != 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Get Info
        id: info
        run: |
          heading=$(grep -m 1 '^## ' CHANGELOG.md)
          version=$(echo "$heading" | grep -oE '^## [0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)[1-9][0-9]*)?$' | cut -c 4-)
          if [ -z "$version" ]; then
            echo "::error::The first section of CHANGELOG.md is \"$heading\", not a version heading such as \"## 1.2.3\""
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create Tag
        env:
          TAG: v${{ steps.info.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "$TAG already exists"
            exit 0
          fi
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git tag -a "$TAG" -m "Release/$TAG"
          git push origin "$TAG"
