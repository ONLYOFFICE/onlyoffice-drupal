name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Get Info
        id: info
        run: |
          version="${GITHUB_REF_NAME#v}"
          heading=$(grep -m 1 '^## ' CHANGELOG.md)
          if [ "$heading" != "## $version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the first section of CHANGELOG.md \"$heading\""
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Extract Release Notes
        env:
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          awk -v head="## $VERSION" '
            $0 == head { p = 1; next }
            /^## [0-9]/ { p = 0 }
            p
          ' CHANGELOG.md > RELEASE.md
      - name: Build Artifact
        run: |
          git archive --prefix=onlyoffice-drupal/ HEAD | tar -x
          git -C assets/document-templates archive --prefix=onlyoffice-drupal/assets/document-templates/ HEAD -- . ':!AUTHORS.md' ':!LICENSE' ':!README.md' | tar -x
      - name: Pack Artifact
        run: zip -r onlyoffice-drupal-${{ steps.info.outputs.version }}.zip onlyoffice-drupal
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: onlyoffice-drupal-${{ steps.info.outputs.version }}.zip
          bodyFile: RELEASE.md
          tag: ${{ github.ref_name }}
